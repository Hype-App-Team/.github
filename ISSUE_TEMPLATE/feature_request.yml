name: Задача / улучшение
description: Новая продуктовая или инженерная задача с критериями приёмки
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Контекст и основание
      description: Какую проблему пользователя или узкое место системы решаем?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки (Definition of Done)
      placeholder: "- [ ] Покрыто автотестами\n- [ ] Контракт обновлён\n- [ ] make verify зелёный"
    validations:
      required: true
