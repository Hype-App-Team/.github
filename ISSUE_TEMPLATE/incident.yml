name: Инцидент / Postmortem (SRE)
description: Разбор сбоя на стенде или в продакшене и меры предотвращения повторения
labels: ["incident", "sre"]
body:
  - type: input
    id: window
    attributes:
      label: Время начала и восстановления (UTC / MSK)
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Влияние на пользователей
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Корневая причина и как сработал откат
    validations:
      required: true
  - type: textarea
    id: action_items
    attributes:
      label: Защитные меры (тесты, алерты, лимиты), чтобы не повторилось
    validations:
      required: true
